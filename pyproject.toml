[project]
name = "agent-assist-bench"
version = "0.1.0"
description = "An open-source evaluation framework for benchmarking AI assistants on real-world engineering workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TheProdSDE" }]

dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.24.0",
    "python-ulid>=2.0.0",
    "aiosqlite>=0.19.0",
    "structlog>=23.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.80.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[dependency-groups]
test = [
    "hypothesis>=6.80.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
lint = [
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
aab = "benchmark.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.sql"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501", "B008"]  # B008: typer.Option() calls in defaults are idiomatic

[tool.ruff.lint.isort]
known-first-party = ["benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "property: Property-based tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
