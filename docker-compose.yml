# Real Agent Frameworks from Source
#
# Builds Hermes and OpenClaw from the external repository clones.
# Both agents expose OpenAI-compatible /v1/chat/completions endpoints.
#
# Usage:
#   docker compose build              # Build images
#   docker compose up -d              # Start containers
#   python test_agents.py             # Test health
#   aab run "Your prompt"             # Run benchmarks

services:
  hermes:
    build:
      context: ./external/hermes-agent
      dockerfile: Dockerfile
    container_name: hermes-agent
    restart: unless-stopped
    command: ["gateway", "run"]
    ports:
      - "8001:8642"    # OpenAI-compatible API  →  http://localhost:8001/v1
      - "8080:8080"    # Hermes web dashboard   →  http://localhost:8080
    volumes:
      - ./docker/hermes/data:/opt/data
    env_file:
      - docker/hermes/.env
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      # Dashboard: bind to all interfaces so it's reachable from the host.
      # Access at http://localhost:8080 — protected by HERMES_DASHBOARD_PASSWORD.
      HERMES_DASHBOARD: "true"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "8080"
    healthcheck:
      # Health endpoint is served on the container's own port (8642), not the host-mapped port
      test: ["CMD", "curl", "-fsS", "http://localhost:8642/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  openclaw:
    build:
      # Use official pre-built image — nvidia extension is already bundled (enabledByDefault: true)
      # Building from source fails due to pnpm/npm timeout on large packages in external/openclaw
      context: ./docker/openclaw
      dockerfile: Dockerfile.source
    container_name: openclaw-agent
    restart: unless-stopped
    command: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--port", "8002"]
    ports:
      - "8002:8002"
    volumes:
      # Mount pre-configured state dir (contains openclaw.json with model + auth config)
      - ./docker/openclaw/state:/home/node/.openclaw
    env_file:
      - docker/openclaw/.env
    environment:
      HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
