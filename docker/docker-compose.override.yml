# Real Hermes and OpenClaw deployment override.
#
# Use this file together with docker/docker-compose.yml:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.override.yml up -d
#
# Provide the required secrets in docker/hermes/.env and docker/openclaw/.env,
# or export them in your shell before starting the stack.

services:
  hermes:
    build:
      context: ./hermes
      # Explicit dockerfile — otherwise the base file's
      # docker/hermes/Dockerfile.source path is inherited and resolved
      # against this context, which does not exist.
      dockerfile: Dockerfile
    restart: unless-stopped
    # The gateway hosts the OpenAI-compatible api_server adapter (port 8642,
    # enabled via API_SERVER_ENABLED/API_SERVER_KEY). It is auto-started by
    # the boot reconciler via HERMES_GATEWAY_BOOTSTRAP_STATE=running (see
    # environment below); the CMD only needs to keep the container alive.
    # The image default CMD boots the interactive TUI, which exits when
    # stdin is not a terminal.
    command: ["sleep", "infinity"]
    ports:
      - "8001:8642"
    # Replace the base mounts entirely: hermes does NOT expand ${VAR}
    # placeholders in config.yaml, and a read-only config mount breaks the
    # image's config migrator. Put real values in ./hermes/data/config.yaml.
    volumes: !override
      - ./hermes/data:/opt/data
    env_file:
      - ./hermes/.env
    environment:
      # Seed gateway_state.json on first boot so the supervised gateway
      # (which hosts the api_server) starts automatically.
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      MODEL_NAME: ${HERMES_MODEL_NAME:-nvidia/nemotron-3-super-120b-a12b}
      MODEL_BASE_URL: ${HERMES_MODEL_BASE_URL:-https://integrate.api.nvidia.com/v1}
      MODEL_API_KEY: ${HERMES_MODEL_API_KEY:-${MODEL_API_KEY:-}}
      BENCH_ENDPOINT: ${HERMES_BENCH_ENDPOINT:-http://localhost:8001}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8642/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    # Drop the base file's source build so the published image is used.
    build: !reset null
    restart: unless-stopped
    # `openclaw serve` does not exist. The gateway serves the OpenAI-compatible
    # POST /v1/chat/completions when gateway.http.endpoints.chatCompletions.enabled
    # is true — all of that (bind, port, auth token, model provider) is set in
    # ./openclaw/data/openclaw.json mounted below.
    command: ["sh", "-lc", "openclaw gateway run"]
    ports:
      - "8002:8002"
    # Replace the base mounts: the state dir carries openclaw.json.
    volumes: !override
      - ./openclaw/data:/home/node/.openclaw
    env_file:
      - ./openclaw/.env
    environment:
      MODEL_NAME: ${OPENCLAW_MODEL_NAME:-nvidia/nemotron-3-super-120b-a12b}
      MODEL_BASE_URL: ${OPENCLAW_MODEL_BASE_URL:-https://integrate.api.nvidia.com/v1}
      MODEL_API_KEY: ${OPENCLAW_MODEL_API_KEY:-${MODEL_API_KEY:-}}
      AGENT_API_KEY: ${OPENCLAW_AGENT_API_KEY:-${AGENT_API_KEY:-}}
      BENCH_ENDPOINT: ${OPENCLAW_BENCH_ENDPOINT:-http://localhost:8002}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
