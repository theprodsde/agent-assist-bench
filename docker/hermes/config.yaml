# Hermes Agent Configuration for AgentAssistBench — TEMPLATE
# Maximum freedom, full tool access.
#
# Copy to ./data/config.yaml and replace the model values with literal
# strings. hermes-agent does NOT expand ${ENV_VAR} placeholders in this
# file, so real values must be written here directly.

# Required by the hermes-agent config migrator; without it the image treats
# the config as ancient and refuses to auto-migrate.
_config_version: 12

model:
  provider: custom
  model: nvidia/nemotron-3-super-120b-a12b
  base_url: https://integrate.api.nvidia.com/v1
  api_key: nvapi-xxxx  # literal value — env vars are NOT expanded here
  temperature: 0.7
  max_tokens: 4096

# Maximum autonomy — no confirmation prompts
agent:
  auto_approve: true
  tool_loop_guardrails:
    hard_stop_enabled: true
    hard_stop_after:
      exact_failure: 10
      idempotent_no_progress: 10

# All tools enabled
tools:
  browser:
    enabled: true
  terminal:
    enabled: true
  web_search:
    enabled: true
