# Hermes Agent Configuration for AgentAssistBench
# Maximum freedom, full tool access, NVIDIA Nemotron-120B backend
#
# This file is seeded into /opt/data/config.yaml on first boot.
# The actual MODEL_BASE_URL, MODEL_API_KEY are read from .env

model:
  provider: custom
  model: ${MODEL_NAME:-nvidia/llama-3.1-nemotron-ultra-253b-v1}
  base_url: ${MODEL_BASE_URL:-https://integrate.api.nvidia.com/v1}
  api_key: ${MODEL_API_KEY}
  temperature: 0.7
  max_tokens: 4096

# Maximum autonomy — no confirmation prompts
agent:
  auto_approve: true
  tool_loop_guardrails:
    hard_stop_enabled: true
    hard_stop_after:
      exact_failure: 10
      idempotent_no_progress: 10

# All tools enabled
tools:
  browser:
    enabled: true
  terminal:
    enabled: true
  web_search:
    enabled: true
