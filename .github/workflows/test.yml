name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
      - name: Checkout code
        run: |
          rm -rf $GITHUB_WORKSPACE || true
          git clone --depth 1 ${{ github.server_url }}/${{ github.repository }}.git $GITHUB_WORKSPACE
          cd $GITHUB_WORKSPACE
          git fetch origin ${{ github.ref }}
          git checkout -f ${{ github.sha }}
      
      - name: Set up Python ${{ matrix.python-version }}
        run: |
          pyenv install -s ${{ matrix.python-version }}
          pyenv shell ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          cd $GITHUB_WORKSPACE
          uv sync --group test
      
      - name: Run tests
        run: |
          cd $GITHUB_WORKSPACE
          uv run pytest tests/ -v --tb=short
