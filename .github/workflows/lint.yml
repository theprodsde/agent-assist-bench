name: Lint & Type Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        run: |
          rm -rf $GITHUB_WORKSPACE || true
          git clone --depth 1 ${{ github.server_url }}/${{ github.repository }}.git $GITHUB_WORKSPACE
          cd $GITHUB_WORKSPACE
          git fetch origin ${{ github.ref }}
          git checkout -f ${{ github.sha }}
      
      - name: Install dependencies
        run: |
          cd $GITHUB_WORKSPACE
          uv sync --group lint
      
      - name: Lint with ruff
        run: |
          cd $GITHUB_WORKSPACE
          uv run ruff check benchmark/ tests/
      
      - name: Format check with ruff
        run: |
          cd $GITHUB_WORKSPACE
          uv run ruff format --check benchmark/ tests/
      
      - name: Type check with mypy
        run: |
          cd $GITHUB_WORKSPACE
          uv run mypy benchmark/
